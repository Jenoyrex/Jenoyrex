name: activity graph

# Redraws assets/activity.svg from the live contribution calendar once a day.
# It commits only when the weekly totals change, and it has no push trigger, so its own
# commits never start another run.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-graph
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributions and redraw the graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/generate_stats.py --refresh

      - name: Commit if the graph changed
        run: |
          if git diff --quiet -- assets/activity.svg data/contributions.json README.md; then
            echo "Contribution graph unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg data/contributions.json README.md
          git commit -m "chore(activity): refresh contribution graph"
          git push
