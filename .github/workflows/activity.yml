name: activity

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the contribution calendar and render the graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_stats.py --refresh

      - name: Commit only if the graph or data changed
        run: |
          if git diff --quiet -- assets/activity.svg data/contributions.json; then
            echo "activity graph unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg data/contributions.json
          git commit -m "chore: refresh activity graph"
          git push
