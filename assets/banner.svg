<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Jenoy Rex</title>
  <desc id="desc">Jenoy Rex. Data Science Engineering. Backend systems, LLM evaluation and ML experimentation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="0.6" stop-color="#0d1320"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2a3d" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#000" stop-opacity="1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect width="1280" height="320" fill="url(#fade)" transform="scale(-1 1) translate(-1280 0)"/></mask>
  </defs>

  <rect width="1280" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="14" fill="url(#grid)" mask="url(#gridmask)" opacity="0.55"/>
  <rect width="1280" height="320" rx="14" fill="url(#glow)"/>

  <!-- abstract node graph (decorative) -->
  <g stroke="#334155" stroke-width="1.2" fill="none" opacity="0.9">
    <path d="M820 92 L905 150 L1010 104 L1105 168 L1190 118"/>
    <path d="M905 150 L962 232 L1068 246 L1105 168"/>
    <path d="M820 92 L862 214 L962 232"/>
    <path d="M1010 104 L1068 246"/>
    <path d="M1190 118 L1168 236 L1068 246"/>
  </g>
  <g stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.85">
    <path d="M862 214 L905 150 L1010 104 L1105 168 L1168 236"/>
  </g>
  <g fill="#0d1320" stroke-width="2">
    <circle cx="820" cy="92" r="5" stroke="#475569"/>
    <circle cx="862" cy="214" r="6" stroke="#38bdf8"/>
    <circle cx="905" cy="150" r="7" stroke="#38bdf8"/>
    <circle cx="962" cy="232" r="5" stroke="#475569"/>
    <circle cx="1010" cy="104" r="8" stroke="#818cf8"/>
    <circle cx="1068" cy="246" r="5" stroke="#475569"/>
    <circle cx="1105" cy="168" r="7" stroke="#a78bfa"/>
    <circle cx="1168" cy="236" r="6" stroke="#a78bfa"/>
    <circle cx="1190" cy="118" r="5" stroke="#475569"/>
  </g>

  <!-- identity -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="72" y="92" font-size="18" fill="#64748b">~/jenoyrex <tspan fill="#38bdf8">$</tspan> whoami</text>
  </g>
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
    <text x="68" y="170" font-size="76" font-weight="700" fill="#f1f5f9" letter-spacing="-1">Jenoy Rex</text>
    <rect x="72" y="192" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="236" font-size="29" font-weight="600" fill="#cbd5e1" textLength="708" lengthAdjust="spacing">Data Science Engineering · Backend &amp; ML Systems</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="19" fill="#94a3b8">
    <text x="72" y="276">APIs · data pipelines · LLM evaluation · security</text>
  </g>
</svg>
