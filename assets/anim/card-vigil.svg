<svg xmlns="http://www.w3.org/2000/svg" width="420" height="196" viewBox="0 0 420 196">
<style>.tw{animation:tw 3s ease-in-out infinite;opacity:.2}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.card{animation:rise .9s cubic-bezier(.2,.8,.2,1) 0.5s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sweep{animation:sweep 6s linear 1.5s infinite}@keyframes sweep{0%{transform:translateX(-160px)}40%,100%{transform:translateX(580px)}}
.dot{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}</style>
