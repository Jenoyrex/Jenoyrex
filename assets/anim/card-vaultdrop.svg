<svg xmlns="http://www.w3.org/2000/svg" width="420" height="196" viewBox="0 0 420 196">
<style>.tw{animation:tw 3s ease-in-out infinite;opacity:.2}@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.card{animation:rise .9s cubic-bezier(.2,.8,.2,1) 0.15s both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.sweep{animation:sweep 6s linear 1.15s infinite}@keyframes sweep{0%{transform:translateX(-160px)}40%,100%{transform:translateX(580px)}}
.dot{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}</style>
<defs><clipPath id="r"><rect x="1" y="1" width="418" height="194" rx="14"/></clipPath>
<linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<g class="card">
<rect x=".5" y=".5" width="419" height="195" rx="14" fill="#0d1117" stroke="#30363d"/>
<g clip-path="url(#r)"><g opacity=".8"><circle class="tw" cx="5.5" cy="96.4" r="0.73" fill="#fff" style="animation-delay:1.21s;animation-duration:2.85s"/>
<circle class="tw" cx="145.7" cy="63.4" r="0.92" fill="#fff" style="animation-delay:0.01s;animation-duration:4.38s"/>
