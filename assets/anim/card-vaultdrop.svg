<circle class="tw" cx="347.9" cy="57.7" r="0.97" fill="#fff" style="animation-delay:1.00s;animation-duration:3.16s"/>
<circle class="tw" cx="214.5" cy="39.7" r="0.69" fill="#fff" style="animation-delay:3.82s;animation-duration:4.71s"/>
<circle class="tw" cx="338.5" cy="122.6" r="0.96" fill="#fff" style="animation-delay:3.76s;animation-duration:3.87s"/>
<circle class="tw" cx="300.5" cy="13.3" r="0.87" fill="#fff" style="animation-delay:1.80s;animation-duration:4.38s"/>
<circle class="tw" cx="269.5" cy="57.8" r="0.52" fill="#fff" style="animation-delay:3.71s;animation-duration:2.82s"/>
<circle class="tw" cx="198.5" cy="68.6" r="0.65" fill="#fff" style="animation-delay:2.96s;animation-duration:4.94s"/>
<circle class="tw" cx="111.2" cy="127.3" r="0.65" fill="#fff" style="animation-delay:2.23s;animation-duration:3.49s"/></g>
<rect class="sweep" x="0" y="0" width="120" height="196" fill="url(#sh)" transform="skewX(-20)"/></g>
<text x="22" y="46" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#e6edf3">🔐 VaultDrop</text>
<rect x="349.6" y="28" width="48.4" height="22" rx="11" fill="#0f2a1b" stroke="#238636" stroke-opacity=".6"/>
<circle class="dot" cx="360.6" cy="39" r="3.5" fill="#3fb950"/>
<text x="369.6" y="43.5" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="10.5" fill="#7ee787">demo</text>
<text x="22" y="86" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">A file vault experiment where files are encrypted in</text><text x="22" y="106" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">the browser (Web Crypto, AES-GCM) before they are</text><text x="22" y="126" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">uploaded.</text>
