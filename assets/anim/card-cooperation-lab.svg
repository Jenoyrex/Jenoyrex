<text x="22" y="46" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#e6edf3">🤝 Cooperation Lab</text>
<rect x="290.2" y="28" width="107.8" height="22" rx="11" fill="#0f2a1b" stroke="#238636" stroke-opacity=".6"/>
